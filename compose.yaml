# Local development only; credentials and published ports are not production configuration.
services:
  postgres:
    image: postgres:17-bookworm
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-vayro}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-vayro_local_only}
      POSTGRES_DB: ${POSTGRES_DB:-vayro}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 3s
      retries: 10
  api:
    build: .
    environment:
      APP_ENV: development
      HTTP_ADDR: :8080
      LOG_LEVEL: ${LOG_LEVEL:-info}
      DATABASE_URL: postgres://${POSTGRES_USER:-vayro}:${POSTGRES_PASSWORD:-vayro_local_only}@postgres:5432/${POSTGRES_DB:-vayro}?sslmode=disable
    ports:
      - "127.0.0.1:${HTTP_PORT:-8080}:8080"
    depends_on:
      postgres:
        condition: service_healthy
  worker:
    build: .
    command: ["/worker"]
    environment:
      APP_ENV: development
      LOG_LEVEL: ${LOG_LEVEL:-info}
      DATABASE_URL: postgres://${POSTGRES_USER:-vayro}:${POSTGRES_PASSWORD:-vayro_local_only}@postgres:5432/${POSTGRES_DB:-vayro}?sslmode=disable
    depends_on:
      postgres:
        condition: service_healthy
volumes:
  postgres_data:
